services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tolif}
      POSTGRES_USER: ${POSTGRES_USER:-tolif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tolif} -d ${POSTGRES_DB:-tolif}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (S3-compatible object storage) ────────────────────────────────────
  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── ASP.NET Core API ────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tolif}
      POSTGRES_USER: ${POSTGRES_USER:-tolif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-tolif}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tolif.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345!}
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt_secret_min_32_chars_long}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      DATA_PROTECTION_KEYS_PATH: /app/dataprotection-keys
    volumes:
      - dp_keys:/app/dataprotection-keys
    ports:
      - "5000:8080"

  # ── Next.js Web App ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3000:3000"

  # ── Caddy Reverse Proxy ─────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  dp_keys:
  caddy_data:
  caddy_config:
